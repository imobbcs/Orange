# Runs on every PR to main (and on main itself): the tests, a type check, the X bot syntax
# check and a production build. A red check on a PR means: don't merge yet.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile in the repo, so a plain install (same as Railway's build)
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: node --check twitter-bot/bot.js
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
